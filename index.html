<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Future of AI</title>
    <style>
        body { background-color: #0f172a; color: #ffffff; font-family: sans-serif; margin: 0; }

        /* الغلاف الرئيسي في الأعلى */
        .header-cover {
            width: 100%;
            height: 400px;
            background-image: url('cover.png'); /* تأكد أن هذا هو اسم ملف الغلاف */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-bottom: 3px solid #00d2ff;
        }

        /* الصورة الكبيرة المفرودة (مرة واحدة فقط) */
        .main-content-image {
            width: 90%;
            display: block;
            margin: 40px auto;
            border-radius: 15px;
            border: 2px solid #00d2ff;
        }

        /* البطاقات */
        .cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; }
        .card { background: #1e293b; padding: 20px; width: 300px; border-radius: 10px; }
        .card h3 { color: #00d2ff; }
        .visit-btn { display: block; background: #00d2ff; color: #0f172a; text-align: center; padding: 10px; text-decoration: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- 1. الغلاف في الأعلى -->
    <div class="header-cover"></div>

    <!-- 2. الصورة الكبيرة (مرة واحدة) -->
    <img src="design.png" alt="Main AI Visual" class="main-content-image">

    <!-- 3. البطاقات -->
    <div class="cards">
        <div class="card">
            <h3>ChatGPT</h3>
            <p>Advanced AI for conversations and tasks.</p>
            <a href="#" class="visit-btn">Visit</a>
        </div>
        <div class="card">
            <h3>DeepSeek</h3>
            <p>Powerful reasoning and coding capabilities.</p>
            <a href="#" class="visit-btn">Visit</a>
        </div>
    </div>

</body>
</html>
