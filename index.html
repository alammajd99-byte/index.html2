<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Future of AI</title>
    <style>
        body { background-color: #0f172a; color: #ffffff; font-family: sans-serif; margin: 0; }

        /* اللوجو في الأعلى */
        .header-logo {
            width: 100%;
            height: 400px;
            background-image: url('hero-slide.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            border-bottom: 3px solid #00d2ff;
        }

        /* الصور الكبيرة تحت بعضها */
        .content-images {
            width: 90%;
            margin: 40px auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .content-images img {
            width: 100%;
            border-radius: 15px;
            border: 2px solid #00d2ff;
        }

        /* البطاقات */
        .cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; }
        .card { background: #1e293b; padding: 20px; width: 300px; border-radius: 10px; }
        .card h3 { color: #00d2ff; }
        .visit-btn { display: block; background: #00d2ff; color: #0f172a; text-align: center; padding: 10px; text-decoration: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- 1. اللوجو في الأعلى -->
    <div class="header-logo"></div>

    <!-- 2. الصور الكبيرة تحت بعضها -->
    <div class="content-images">
        <img src="design.png" alt="AI Robot">
        <img src="design.png" alt="AI Automation">
    </div>

    <!-- 3. البطاقات -->
    <div class="cards">
        <div class="card">
            <h3>ChatGPT</h3>
            <p>Advanced AI for conversations and tasks.</p>
            <a href="#" class="visit-btn">Visit</a>
        </div>
        <div class="card">
            <h3>DeepSeek</h3>
            <p>Powerful reasoning and coding capabilities.</p>
            <a href="#" class="visit-btn">Visit</a>
        </div>
    </div>

</body>
</html>
